<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سياسة الخصوصية | تحدي كلمات السعودية</title><style>body{font-family:Arial,Tahoma,sans-serif;background:#0f172a;color:#f8fafc;line-height:1.9;max-width:760px;margin:auto;padding:28px}a{color:#86efac}</style></head><body><h1>سياسة الخصوصية</h1><p>اللعبة لا تطلب تسجيل دخول ولا تجمع بيانات شخصية. يتم حفظ نتيجتك محلياً داخل متصفحك باستخدام LocalStorage.</p><p>عند تفعيل الإعلانات أو التحليلات مستقبلاً قد تستخدم خدمات طرف ثالث ملفات تعريف ارتباط حسب سياساتها، وسيتم تحديث هذه الصفحة.</p><p><a href="./">العودة للعبة</a></p></body></html>
